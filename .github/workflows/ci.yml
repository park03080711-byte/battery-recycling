name: CI

# PR마다(그리고 main에 올라갈 때) 타입 · 린트 · 빌드 · 주요 페이지 점검을 돌린다.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npm run typecheck
      - name: 린트
        run: npm run lint
      - name: 빌드
        run: npm run build
      - name: 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: 주요 페이지 점검
        run: npm run test:smoke
      - name: 실패 시 보고서 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7
